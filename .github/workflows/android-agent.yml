name: Android Agent

on:
  push:
    branches: [dev, main]
    paths: ["native/platforms/android/**", ".github/workflows/android-agent.yml"]
  pull_request:
    paths: ["native/platforms/android/**", ".github/workflows/android-agent.yml"]

concurrency:
  group: android-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    # dev→main 的 PR 和推 dev 是同一个提交，dev 上已经跑过，这里跳过（跳过算通过）
    if: ${{ !(github.event_name == 'pull_request' && github.head_ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Agent host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure, build and test
        run: |
          cmake -S native/platforms/android/agent -B "${{ runner.temp }}/agent-host" -DEMMY_AGENT_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build "${{ runner.temp }}/agent-host" --parallel
          ctest --test-dir "${{ runner.temp }}/agent-host" --output-on-failure

  ndk-build:
    # dev→main 的 PR 和推 dev 是同一个提交，dev 上已经跑过，这里跳过（跳过算通过）
    if: ${{ !(github.event_name == 'pull_request' && github.head_ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Agent NDK build (arm64-v8a, armeabi-v7a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          # GitHub 的 Ubuntu runner 预装了 NDK
          export ANDROID_NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          native/platforms/android/build_agent.sh "${{ runner.temp }}/android-agent"
      - name: Check exports and dependencies
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          tools="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for abi in arm64-v8a armeabi-v7a; do
            so="${{ runner.temp }}/android-agent/$abi/libemmylua_agent.so"
            # 只能依赖系统库：agent 注入到别人的进程里，不能要求应用带 libc++_shared.so
            needed=$("$tools/llvm-readelf" -d "$so" | grep NEEDED | grep -oE '\[[^]]+\]' | tr -d '[]' | sort | tr '\n' ' ')
            echo "$abi NEEDED: $needed"
            for lib in $needed; do
              case "$lib" in liblog.so|libm.so|libdl.so|libc.so) ;; *) echo "意外的依赖 $lib"; exit 1;; esac
            done
            exports=$("$tools/llvm-nm" -D --defined-only "$so" | awk '{print $3}' | sort | tr '\n' ' ')
            echo "$abi exports: $exports"
            [ "$exports" = "Agent_OnAttach Agent_OnLoad JNI_OnLoad " ] || { echo "导出符号不对"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: emmylua-android-agent
          path: ${{ runner.temp }}/android-agent/*/libemmylua_agent.so
