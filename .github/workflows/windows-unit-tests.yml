name: Windows Unit Tests

# 开发机是 Windows：不依赖 IntelliJ 的几个模块的单测在 Windows 上也跑一遍，路径分隔符、盘符、大小写这类差异在这里暴露。
# 还没进出包门槛（auto-release.yml 的 tests-gate），先观察几次都绿再加进去。
on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: windows-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  modules:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Module tests
        run: ./gradlew --no-daemon :modules:debugger-protocol:test :modules:debugger-engine:test :modules:debugger-mcp:test
      - name: Preserve test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-unit-test-reports
          path: modules/*/build/reports/tests/
