name: Native Core

# 新原生调试核心 native/emmy_debugger_core：各 Lua 版本的单元 / 端到端测试、动态 API 模式、性能基准。
on:
  push:
    branches: [dev, main]
    paths:
      - "native/emmy_debugger_core/**"
      - "native/third-party/**"
      - "native/emmy_attach/**"
      - "native/emmy_tool/**"
      - "native/shared/**"
      - "native/tests/**"
      - "native/CMakeLists.txt"
      - ".github/workflows/native-core.yml"
  pull_request:
    paths:
      - "native/emmy_debugger_core/**"
      - "native/third-party/**"
      - "native/emmy_attach/**"
      - "native/emmy_tool/**"
      - "native/shared/**"
      - "native/tests/**"
      - "native/CMakeLists.txt"
      - ".github/workflows/native-core.yml"

concurrency:
  group: native-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Lua ${{ matrix.lua }}, ${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        lua: ["51", "52", "53", "54"]
        mode: [source]
        include:
          - { os: ubuntu-latest, lua: "54", mode: dynamic }
          - { os: ubuntu-latest, lua: "51", mode: dynamic }
          - { os: windows-latest, lua: "54", mode: source }
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S native/emmy_debugger_core -B build/core -DCMAKE_BUILD_TYPE=Release -DEMMY_CORE_LUA_VERSION=${{ matrix.lua }} -DEMMY_CORE_LUA_MODE=${{ matrix.mode }}
      - name: Build
        run: cmake --build build/core --config Release --parallel 4
      - name: Test
        run: ctest --test-dir build/core -C Release --output-on-failure --timeout 300

  android:
    name: android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v4
      - name: Build (dynamic Lua API, c++_static)
        run: |
          cmake -S native/emmy_debugger_core -B build/core-android \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-21 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/core-android --parallel 4

  windows-attach:
    # Windows 本机附加（协议 v3）的全部文件：emmy_tool.exe、emmy_attach.dll、EasyHook.dll、lua5X/emmy_debugger_core.dll
    name: windows-attach (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, platform: x64 }
          - { arch: x86, platform: Win32 }
    steps:
      - uses: actions/checkout@v4
      - name: Build emmy_tool / emmy_attach
        run: |
          cmake -S native -B build/native-${{ matrix.arch }} -A ${{ matrix.platform }}
          cmake --build build/native-${{ matrix.arch }} --config Release --target emmy_tool emmy_attach --parallel 4
      - name: Build cores (dynamic, one per Lua version)
        run: |
          foreach ($v in "51", "52", "53", "54") {
            cmake -S native/emmy_debugger_core -B build/core-${{ matrix.arch }}-$v -A ${{ matrix.platform }} `
              -DEMMY_CORE_LUA_MODE=dynamic "-DEMMY_CORE_LUA_VERSION=$v" -DEMMY_CORE_BUILD_SHARED=ON `
              -DEMMY_CORE_BUILD_TESTS=OFF -DEMMY_CORE_BUILD_BENCH=OFF
            if ($LASTEXITCODE -ne 0) { exit 1 }
            cmake --build build/core-${{ matrix.arch }}-$v --config Release --target emmy_debugger_core_shared --parallel 4
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
      - name: Collect
        run: |
          $out = "out/${{ matrix.arch }}"
          New-Item -ItemType Directory -Force $out | Out-Null
          # 连同 PDB 一起放进产物：发布时 PDB 单独打包，这里先确认每个都生成了
          foreach ($name in "emmy_tool.exe", "emmy_attach.dll", "EasyHook.dll", "emmy_tool.pdb", "emmy_attach.pdb", "EasyHook.pdb") {
            $file = Get-ChildItem build/native-${{ matrix.arch }} -Recurse -Filter $name | Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
            if (-not $file) { Write-Error "缺少 $name"; exit 1 }
            Copy-Item $file.FullName -Destination $out
          }
          foreach ($v in "51", "52", "53", "54") {
            New-Item -ItemType Directory -Force "$out/lua$v" | Out-Null
            Copy-Item build/core-${{ matrix.arch }}-$v/Release/emmy_debugger_core.dll "$out/lua$v/"
            Copy-Item build/core-${{ matrix.arch }}-$v/Release/emmy_debugger_core.pdb "$out/lua$v/"
          }
          Get-ChildItem -Recurse $out | Select-Object FullName, Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows-attach-${{ matrix.arch }}
          path: out/${{ matrix.arch }}
      # 端到端：真的注入一个只链接 lua54.dll 的进程，下断点、停下、断开、再附加；再测先附加、后延迟加载 Lua 时断在顶层代码（native/tests/attach_e2e）
      - name: Attach end-to-end
        run: |
          cmake -S native/tests/attach_e2e -B build/e2e-${{ matrix.arch }} -A ${{ matrix.platform }}
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build build/e2e-${{ matrix.arch }} --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $bin = "build/e2e-${{ matrix.arch }}/Release"
          # 宿主要找得到 lua54.dll（和宿主放在一起）
          Get-ChildItem build/e2e-${{ matrix.arch }} -Recurse -Filter lua54.dll | Select-Object -First 1 | Copy-Item -Destination $bin
          $tools = (Resolve-Path "out/${{ matrix.arch }}").Path
          & "$bin/attach_driver.exe" $tools (Resolve-Path "$bin/attach_host.exe").Path (Resolve-Path "$bin/attach_host_late.exe").Path
          exit $LASTEXITCODE

  bench:
    # 共享 CI 机器抖动大，不卡绝对目标（本地用 bench_hook --check 对照目标）；
    # 卡相对基线的回退：同一次运行里相对「不挂调试器」的倍数比 bench/baseline.json 高出 25% 就失败
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S native/emmy_debugger_core -B build/bench -DCMAKE_BUILD_TYPE=Release -DEMMY_CORE_BUILD_TESTS=OFF
          cmake --build build/bench --target bench_hook --parallel 4
      - name: Run
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          set -o pipefail
          ./build/bench/bench_hook --repeat 7 --json bench_hook.json --baseline native/emmy_debugger_core/bench/baseline.json \
            | tee -a "$GITHUB_STEP_SUMMARY" || rc=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit ${rc:-0}
      - uses: actions/upload-artifact@v4
        with:
          name: bench_hook
          path: bench_hook.json
