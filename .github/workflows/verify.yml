name: Verify Plugin

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 只编 2025.2 一个包（不设 until-build）；verifyPlugin 再对之后的每个大版本校验 API 兼容
        idea-version: ["252"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check doc links
        run: python3 .github/scripts/check-doc-links.py
      - name: Build native core host for engine end-to-end tests
        run: |
          cmake -S native/emmy_debugger_core -B build/core -DCMAKE_BUILD_TYPE=Release
          cmake --build build/core --target emmy_core_ide_host --parallel 4
      # 推到 dev 就验证 emmylua_ls 能下到；产物在 build/ 下（已忽略），不影响末尾的干净检查
      - name: Fetch emmylua_ls binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/fetch-emmylua-ls.sh "" build/emmylua-ls
      # 真 emmylua_ls 冒烟：UE 布局下的声明能跳转、5 万行声明的冷启动时间（docs/design/lsp-migration.md 的目标）
      - name: emmylua_ls smoke test
        run: python3 .github/scripts/lsp-smoke.py build/emmylua-ls/linux-x64/emmylua_ls --report "$GITHUB_STEP_SUMMARY"
      - name: Test, build and verify
        env:
          # 新引擎对着真的原生核心跑端到端用例（NativeRuntimeE2eTest）
          EMMY_CORE_HOST: ${{ github.workspace }}/build/core/emmy_core_ide_host
          # 真 luafmt 跑表字段对齐（LuaFormatterRealTest）
          EMMYLUA_LUAFMT: ${{ github.workspace }}/build/emmylua-ls/linux-x64/luafmt
          # 推 main 是为了出包：同一个提交在 dev 上已经校验过全部版本，这里只校验最低（编译用的 2025.2）和最高版本，省下载和校验时间
          VERIFY_IDES: ${{ github.ref == 'refs/heads/main' && '2026.3' || '2025.3,2026.1,2026.2,2026.3' }}
        run: ./gradlew --no-daemon -DIDEA_VER=${{ matrix.idea-version }} -PverifyIdes=$VERIFY_IDES test buildPlugin verifyPlugin
      - name: Preserve JVM and plugin verification reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-idea-${{ matrix.idea-version }}
          if-no-files-found: error
          path: |
            build/test-results/test/*.xml
            modules/*/build/test-results/test/*.xml
            build/reports/pluginVerifier/**
      - name: Verify clean checkout
        shell: bash
        run: git diff --exit-code
