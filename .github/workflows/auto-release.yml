# GitHub Actions 工作流名称
name: Build and Release on Push to Main

# 触发工作流的事件
on:
  push:
    branches:
      - main

# 全局环境变量
env:
  PLUGIN_XML_PATH: src/main/resources/META-INF/plugin.xml

# 工作流运行的任务
jobs:
  # 出包门槛：同一个提交上的「Verify Plugin」「Native Core」「Android Agent」都通过才发版。
  # 这几个工作流和本工作流同时被 push 触发，这里等它们跑完；因路径过滤没有触发的（这次没改到）算通过。
  tests-gate:
    name: Wait for tests
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Wait for test workflows on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: bash .github/scripts/wait-for-checks.sh "$SHA" verify.yml native-core.yml android-agent.yml

  # 原生二进制在出包时现编（不提交进仓库）：Windows 附加用的工具和 dll、Android 真机附加的 agent
  native-windows:
    name: Native windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - { arch: x64, platform: x64 }
          - { arch: x86, platform: Win32 }
    steps:
      - uses: actions/checkout@v4
      - name: Build emmy_tool / emmy_attach
        run: |
          cmake -S native -B build/native-${{ matrix.arch }} -A ${{ matrix.platform }}
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build build/native-${{ matrix.arch }} --config Release --target emmy_tool emmy_attach --parallel 4
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Build cores (dynamic, one per Lua version)
        run: |
          # runtime 版本带上提交号：IDE 连上后和插件自带的 runtime-version.txt 比，
          # 目标进程里还是更新插件前注入的旧组件时提示重启游戏 / 编辑器
          $coreVersion = "3.0.0+$($env:GITHUB_SHA.Substring(0, 7))"
          foreach ($v in "51", "52", "53", "54") {
            cmake -S native/emmy_debugger_core -B build/core-${{ matrix.arch }}-$v -A ${{ matrix.platform }} `
              -DEMMY_CORE_LUA_MODE=dynamic "-DEMMY_CORE_LUA_VERSION=$v" -DEMMY_CORE_BUILD_SHARED=ON "-DEMMY_CORE_VERSION=$coreVersion" `
              -DEMMY_CORE_BUILD_TESTS=OFF -DEMMY_CORE_BUILD_BENCH=OFF
            if ($LASTEXITCODE -ne 0) { exit 1 }
            cmake --build build/core-${{ matrix.arch }}-$v --config Release --target emmy_debugger_core_shared --parallel 4
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
      - name: Collect
        run: |
          $out = "out/${{ matrix.arch }}"
          New-Item -ItemType Directory -Force $out | Out-Null
          foreach ($name in "emmy_tool.exe", "emmy_attach.dll", "EasyHook.dll") {
            $file = Get-ChildItem build/native-${{ matrix.arch }} -Recurse -Filter $name | Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
            if (-not $file) { Write-Error "缺少 $name"; exit 1 }
            Copy-Item $file.FullName -Destination $out
          }
          [System.IO.File]::WriteAllText("$PWD/$out/runtime-version.txt", "3.0.0+$($env:GITHUB_SHA.Substring(0, 7))")
          foreach ($v in "51", "52", "53", "54") {
            New-Item -ItemType Directory -Force "$out/lua$v" | Out-Null
            Copy-Item build/core-${{ matrix.arch }}-$v/Release/emmy_debugger_core.dll "$out/lua$v/"
          }
          Get-ChildItem -Recurse $out | Select-Object FullName, Length
          # PDB 不进插件包（太大），按和 DLL 相同的目录结构单独上传到 Release
          $pdb = "symbols/${{ matrix.arch }}"
          New-Item -ItemType Directory -Force $pdb | Out-Null
          foreach ($name in "emmy_tool.pdb", "emmy_attach.pdb", "EasyHook.pdb") {
            $file = Get-ChildItem build/native-${{ matrix.arch }} -Recurse -Filter $name | Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
            if (-not $file) { Write-Error "缺少 $name"; exit 1 }
            Copy-Item $file.FullName -Destination $pdb
          }
          foreach ($v in "51", "52", "53", "54") {
            New-Item -ItemType Directory -Force "$pdb/lua$v" | Out-Null
            Copy-Item build/core-${{ matrix.arch }}-$v/Release/emmy_debugger_core.pdb "$pdb/lua$v/"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.arch }}
          path: out/${{ matrix.arch }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: symbols-windows-${{ matrix.arch }}
          path: symbols/${{ matrix.arch }}
          if-no-files-found: error

  android-agent:
    name: Android agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          export ANDROID_NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          native/platforms/android/build_agent.sh "${{ runner.temp }}/android-agent"
          mkdir -p out
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p "out/$abi"
            cp "${{ runner.temp }}/android-agent/$abi/libemmylua_agent.so" "out/$abi/"
          done
          ls -lR out
      - uses: actions/upload-artifact@v4
        with:
          name: release-android-agent
          path: out
          if-no-files-found: error

  # 打包和测试门槛并行：包先打好，门槛通过后 release 只做发布，不再从头编一遍
  package:
    needs: [native-windows, android-agent]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versioning.outputs.version }}
      changelog: ${{ steps.generate_notes.outputs.changelog }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Calculate New Version
        id: versioning
        run: |
          TRACKING_FILE="version.properties"
          INITIAL_COMMIT="3639f63474c46a89fb15be2bd4cc4fac356d8e8c"
          if [ -f "$TRACKING_FILE" ]; then
            source $TRACKING_FILE
            LAST_COMMIT_HASH=$LAST_COMMIT
            COMMIT_COUNT=$(git rev-list --count $LAST_COMMIT_HASH..${{ github.sha }})
            IFS='.' read -r -a V <<< "$LAST_VERSION"
            MAJOR=${V[0]}; MINOR=${V[1]}; PATCH=${V[2]}
            CURRENT_YEAR=$(date +'%Y'); LAST_RELEASE_YEAR=$(date -d "$LAST_RELEASE_DATE" +'%Y')
            if [ "$CURRENT_YEAR" -gt "$LAST_RELEASE_YEAR" ]; then
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
            else
              if [ "$COMMIT_COUNT" -gt 15 ]; then
                MINOR=$((MINOR + 1)); PATCH=0
              else
                PATCH=$((PATCH + 1))
              fi
            fi
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          else
            NEW_VERSION=$(grep -oP '(?<=<version>).*?(?=</version>)' ${{ env.PLUGIN_XML_PATH }})
            LAST_COMMIT_HASH=$INITIAL_COMMIT
          fi
          echo "最终版本号为: $NEW_VERSION"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "LAST_COMMIT_HASH=$LAST_COMMIT_HASH" >> $GITHUB_ENV
      - name: Generate Release Notes
        id: generate_notes
        run: |
          LOG_MD=$(git log ${{ env.LAST_COMMIT_HASH }}..${{ github.sha }} --pretty=format:'* %s (%h)' \
            | grep -vE "Merge branch|Merge remote-tracking branch|Update auto-release.yml")
          if [ -z "$LOG_MD" ]; then
            LOG_MD="* 本次更新没有包含新的有效代码提交。"
          fi
          {
            echo 'changelog<<EOF'
            echo "$LOG_MD"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          # 同一份提交列表也作为插件市场的更新说明（build.gradle.kts 读 -PchangeNotesFile）
          mkdir -p build
          echo "$LOG_MD" > build/change-notes.md

      # 把现编的原生二进制放进插件资源（覆盖仓库里旧的 Windows 二进制）
      - name: Download native binaries
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: ${{ runner.temp }}/native
      - name: Place native binaries into plugin resources
        run: |
          set -e
          for arch in x64 x86; do
            mkdir -p "src/main/resources/debugger/emmy/windows/$arch"
            cp -R "${{ runner.temp }}/native/release-windows-$arch/." "src/main/resources/debugger/emmy/windows/$arch/"
          done
          mkdir -p src/main/resources/debugger/emmy/android
          cp -R "${{ runner.temp }}/native/release-android-agent/." src/main/resources/debugger/emmy/android/
          find src/main/resources/debugger/emmy/windows src/main/resources/debugger/emmy/android -type f | sort

      # 下载 emmylua_ls 各平台可执行文件到 build/emmylua-ls，prepareSandbox 会放进插件的 server/ 目录
      - name: Fetch emmylua_ls binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/fetch-emmylua-ls.sh "" build/emmylua-ls

      # Windows 调试符号：x64 / x86 各一个目录，和插件里 debugger/emmy/windows/<arch> 的结构一致
      - name: Download Windows symbols
        uses: actions/download-artifact@v4
        with:
          pattern: symbols-windows-*
          path: ${{ runner.temp }}/symbols
      - name: Pack Windows symbols
        run: |
          set -e
          mkdir -p build/symbols
          cd "${{ runner.temp }}/symbols"
          for arch in x64 x86; do mv "symbols-windows-$arch" "$arch"; done
          zip -r "$GITHUB_WORKSPACE/build/symbols/emmylua-windows-pdb-v${{ env.NEW_VERSION }}.zip" x64 x86

      # 第六步：执行 Gradle 打包命令
      # --- 核心修正点：在这里通过 -P 参数将版本号传递给 Gradle ----
      - name: Build with Gradle
        run: ./gradlew buildPlugin -x buildSearchableOptions -PpluginVersion=${{ env.NEW_VERSION }} -PchangeNotesFile=build/change-notes.md

      # 没带上语言服务器的包不发布
      - name: Check emmylua_ls in plugin zip
        run: |
          set -e
          zips=(build/distributions/*.zip)
          [ -f "${zips[0]}" ] || { echo "::error::build/distributions 下没有插件 zip"; exit 1; }
          for zip in "${zips[@]}"; do
            if ! unzip -l "$zip" | grep -qE '/server/win32-x64/emmylua_ls\.exe$'; then
              echo "::error::$zip 里没有 server/win32-x64/emmylua_ls.exe"
              exit 1
            fi
            unzip -l "$zip" | grep '/server/'
          done

      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: |
            build/distributions/*.zip
            build/symbols/*.zip
          if-no-files-found: error

  release:
    needs: [tests-gate, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NEW_VERSION: ${{ needs.package.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: build
      - run: find build -type f | sort

      # 第七步：创建 GitHub Release 并上传构建产物
      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## 自动构建产物 (v${{ env.NEW_VERSION }})

            **✨ 本次更新包含以下提交:**
            ${{ needs.package.outputs.changelog }}
          tag_name: v${{ env.NEW_VERSION }}
          name: Auto Build - v${{ env.NEW_VERSION }}
          prerelease: false
          files: |
            build/distributions/*.zip
            build/symbols/*.zip

      # 第八步：更新版本跟踪文件并提交回仓库
      - name: Update and Commit Version Tracking File
        run: |
          echo "LAST_VERSION=${{ env.NEW_VERSION }}" > version.properties
          echo "LAST_COMMIT=${{ github.sha }}" >> version.properties
          echo "LAST_RELEASE_DATE=$(date +'%Y-%m-%d')" >> version.properties
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add version.properties
          git commit -m "chore(release): 自动更新版本至 ${{ env.NEW_VERSION }}" -m "[skip ci]"
          git push

      # 版本跟踪提交只在 main 上，合回 dev，免得 dev 的版本号落后、以后改这个文件冲突。合不上只警告，不影响发版
      - name: Merge release commit back to dev
        continue-on-error: true
        run: |
          git fetch origin dev
          git checkout -B dev-sync origin/dev
          if git merge --no-edit -m "合并发版 v${{ env.NEW_VERSION }} 的版本跟踪提交回 dev [skip ci]" origin/main; then
            git push origin HEAD:dev
          else
            git merge --abort || true
            echo "::warning::版本跟踪提交没能自动合回 dev，请手动 git merge origin/main"
          fi

  # 发布到 JetBrains 插件市场：上传和 GitHub Release 同一个 zip。
  # 单独一个任务：市场上传失败（审核中、令牌过期）只标红这一项，不影响 GitHub Release 和版本跟踪提交。
  # 没配 Secret JETBRAINS_MARKETPLACE_TOKEN 时跳过（插件第一次要在网站上手动上传并通过审核，之后才能用令牌发布）。
  marketplace:
    needs: [package, release]
    runs-on: ubuntu-latest
    env:
      MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
      PLUGIN_XML_ID: com.fixcode.emmylua.enhanced
    steps:
      - name: Check token
        id: token
        run: |
          if [ -z "$MARKETPLACE_TOKEN" ]; then
            echo "::notice::没有配置 Secret JETBRAINS_MARKETPLACE_TOKEN，跳过发布到 JetBrains 插件市场"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Download package
        if: steps.token.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: build
      - name: Upload to JetBrains Marketplace
        if: steps.token.outputs.skip != 'true'
        run: |
          set -e
          zips=(build/distributions/*.zip)
          [ "${#zips[@]}" -eq 1 ] && [ -f "${zips[0]}" ] || { echo "::error::应该正好有一个插件 zip：${zips[*]}"; exit 1; }
          echo "上传 ${zips[0]}（v${{ needs.package.outputs.version }}）"
          code=$(curl -sS --retry 3 -o response.txt -w '%{http_code}' \
            -H "Authorization: Bearer $MARKETPLACE_TOKEN" \
            -F "xmlId=$PLUGIN_XML_ID" \
            -F "file=@${zips[0]}" \
            https://plugins.jetbrains.com/plugin/uploadPlugin)
          cat response.txt; echo
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::插件市场返回 HTTP $code（见上面的返回内容）。401/403 多半是令牌失效或没有这个插件的权限，400 看返回里的原因"
            exit 1
          fi
