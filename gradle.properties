version = 1.0.0
kotlin.stdlib.default.dependency = false

# --- 性能与守护进程配置 ---

# 统一 JVM 参数，防止 IDE 和命令行启动不同的守护进程导致争抢文件锁
# 注意：确保所有开发者都使用相同的内存设置
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# 开启守护进程（速度快，但必须管理好）
org.gradle.daemon=true

# 开启并行编译（提升多模块项目速度）
org.gradle.parallel=true

# 开启构建缓存（复用之前的构建结果）
org.gradle.caching=true

# 守护进程空闲 15 分钟后自动自杀（防止僵尸进程长期占用锁）
# 原来的 2 小时太长了，容易导致残留
org.gradle.daemon.idletimeout=900000

# (可选) 只有在 Windows 上如果频繁遇到文件无法删除/锁定问题，可以尝试开启这个
# 但通常上面的配置配好后就不需要了
# org.gradle.vfs.watch=false

# --- 语言支持（docs/design/lsp-migration.md）---
# LSP 客户端插件，作为必需依赖
lsp4ijVersion=0.21.0
# emmylua_ls 版本（EmmyLuaLs/emmylua-analyzer-rust 的 Release 标签），出包时下载各平台二进制
emmyLuaLsVersion=0.25.1
